name: RTL helper smoke and synthesis checks

on:
  push:
    branches: [main]
    paths:
      - "hardware/rtl/*.v"
      - "verification/rtl/**"
      - ".github/workflows/rtl-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-smoke:
    name: Icarus Verilog + Yosys
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
      - name: Compile and run RTL smoke test
        run: python3 verification/rtl/run_rtl_smoke.py
      - name: Run generic RTL synthesis and structural checks
        run: python3 verification/rtl/run_rtl_synth.py
